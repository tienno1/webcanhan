    <style>
        /* CSS cho modal */
        .modal {
            display: none;
            /* CHỈ CÓ: Modal phải ẩn ban đầu */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            /* Sử dụng flex để căn giữa ảnh modal */
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            display: block;
            width: auto;
            max-width: 95vw;
            /* Tối đa 95% viewport width */
            height: auto;
            max-height: 95vh;
            /* Tối đa 95% viewport height */
            object-fit: contain;
            /* Đảm bảo hình ảnh vừa vặn trong khung mà không bị cắt */
            animation: zoom 0.6s;
            cursor: grab;
        }

        @keyframes zoom {
            from {
                transform: scale(0)
            }

            to {
                transform: scale(1)
            }
        }

        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
            z-index: 1001;
        }

        .close:hover,
        .close:focus {
            color: #bbb;
            text-decoration: none;
            cursor: pointer;
        }

        .modal-controls {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            transform: translateY(-50%);
            z-index: 1001;
        }

        .prev,
        .next,
        .zoom-in,
        .zoom-out {
            cursor: pointer;
            color: white;
            font-weight: bold;
            font-size: 20px;
            transition: 0.6s ease;
            user-select: none;
            padding: 16px;
            border-radius: 5px;
            background-color: rgba(0, 0, 0, 0.5);
            margin: 0 20px;
        }

        .zoom-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 1001;
        }

        /* === BỐ CỤC LINH HOẠT VÀ TÙY CHỈNH (Flexbox) === */
        .image-gallery {
            display: flex;
            /* Sử dụng Flexbox để các ảnh tự động căn chỉnh và xuống dòng */
            flex-wrap: wrap;
            gap: 25px;
            /* Giữ nguyên gap 25px giữa các ảnh */
            padding: 25px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .image-wrapper {
            position: relative;
            cursor: pointer;
            /* Bỏ aspect-ratio: để dùng tỉ lệ ảnh gốc */
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            /* Đảm bảo hình ảnh không bị thu nhỏ khi không đủ chỗ */
            flex-grow: 0;
            flex-shrink: 0;
        }

        .image-wrapper:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
        }

        .image-wrapper img {
            width: 100%;
            height: auto;
            /* Chiều cao tự động để giữ tỉ lệ gốc */
            display: block;
            object-fit: cover;
        }

        /* Định nghĩa các lớp chiều rộng tùy chỉnh dựa trên tỷ lệ phần trăm */
        /* Sử dụng calc(X% - Ypx) để trừ đi khoảng cách (gap) */
        .w-27 { flex-basis: calc(27% - 19px); max-width: calc(27% - 19px); }
        .w-44-7 { flex-basis: calc(44.7% - 19px); max-width: calc(44.7% - 19px); }
        .w-52 { flex-basis: calc(52% - 19px); max-width: calc(52% - 19px); }
        .w-46-5 { flex-basis: calc(46.5% - 19px); max-width: calc(46.5% - 19px); }
        .w-44 { flex-basis: calc(44% - 19px); max-width: calc(44% - 19px); }
        .w-29 { flex-basis: calc(29% - 19px); max-width: calc(29% - 19px); }
        .w-25-5 { flex-basis: calc(25.5% - 19px); max-width: calc(25.5% - 19px); }
        .w-33 { flex-basis: calc(33% - 19px); max-width: calc(33% - 19px); }
        .w-66-5 { flex-basis: calc(66.5% - 19px); max-width: calc(66.5% - 19px); }
        .w-64-6 { flex-basis: calc(64.6% - 19px); max-width: calc(64.6% - 19px); }
        .w-35 { flex-basis: calc(35% - 19px); max-width: calc(35% - 19px); }
        
        /* Nút xem hình ảnh */
        .view-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s ease;
            white-space: nowrap;
        }

        /* Hiển thị nút khi hover vào wrapper */
        .image-wrapper:hover .view-button {
            opacity: 1;
        }

        /* Responsive */
        /* Mobile (dưới 768px): 1 cột */
        @media (max-width: 768px) {
            .image-gallery {
                padding: 15px;
                gap: 15px;
            }
            .image-wrapper {
                /* Vô hiệu hóa các class w-x, force 100% width trên mobile */
                flex-basis: 100% !important;
                max-width: 100% !important;
            }
            /* Ẩn modal trên mobile để tránh lỗi hiển thị */
            .modal {
                display: none !important;
            }
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById("imageModal");
            const modalImg = document.getElementById("modalImage");
            const gallery = document.querySelector(".image-gallery");
            const closeBtn = document.querySelector(".close");
            const prevBtn = document.querySelector(".prev");
            const nextBtn = document.querySelector(".next");
            const zoomInBtn = document.querySelector(".zoom-in");
            const zoomOutBtn = document.querySelector(".zoom-out");
            let currentIndex = 0;
            // Lấy tất cả các thẻ img trong gallery
            let images = Array.from(gallery.querySelectorAll("img"));

            // Biến cho Scale và Dragging
            let currentScale = 1;
            let translateX = 0;
            let translateY = 0;
            let isDragging = false;
            let startX = 0;
            let startY = 0;

            // Hàm áp dụng các biến đổi (scale và translate)
            function updateTransform() {
                modalImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentScale})`;
            }

            // Hàm đặt lại trạng thái modal
            function resetModalState() {
                currentScale = 1;
                translateX = 0;
                translateY = 0;
                modalImg.style.cursor = 'grab';
                updateTransform();
            }

            // Cờ trạng thái để kiểm soát việc mở modal sau khi tải xong
            let isReadyToOpenModal = false;

            // Thiết lập độ trễ ngắn sau khi DOMContentLoaded để bật cờ
            setTimeout(() => {
                isReadyToOpenModal = true;
                console.log("Modal is now ready to be opened via click.");
            }, 200);

            // Open modal on image or button click
            gallery.addEventListener('click', (e) => {
                // 1. [GUARD] Kiểm tra cờ trạng thái
                if (!isReadyToOpenModal) {
                    console.log("Modal block: Page is loading/stabilizing. Cannot open modal yet.");
                    return;
                }

                // 2. Kiểm tra nếu đang ở chế độ mobile, không mở modal
                if (window.innerWidth <= 768) {
                    return;
                }

                // Tìm thẻ cha .image-wrapper gần nhất
                const targetWrapper = e.target.closest('.image-wrapper');

                // Chỉ mở modal nếu click vào .image-wrapper hoặc một phần tử bên trong nó
                if (targetWrapper) {
                    // Kích hoạt Flexbox để căn giữa tuyệt đối
                    modal.style.display = "flex"; // Sửa: Sử dụng 'flex' để căn giữa
                    const img = targetWrapper.querySelector('img');
                    modalImg.src = img.src;
                    currentIndex = images.indexOf(img);

                    // Đặt lại trạng thái khi mở ảnh mới
                    resetModalState();
                }
            });

            // Close modal
            closeBtn.onclick = () => {
                modal.style.display = "none";
                resetModalState(); // Đặt lại trạng thái khi đóng
            };

            // Navigate to next image
            nextBtn.onclick = () => {
                currentIndex = (currentIndex + 1) % images.length;
                modalImg.src = images[currentIndex].src;
                resetModalState(); // Đặt lại trạng thái khi chuyển ảnh
            };

            // Navigate to previous image
            prevBtn.onclick = () => {
                currentIndex = (currentIndex - 1 + images.length) % images.length;
                modalImg.src = images[currentIndex].src;
                resetModalState(); // Đặt lại trạng thái khi chuyển ảnh
            };

            // Zoom in
            zoomInBtn.onclick = () => {
                currentScale += 0.2;
                updateTransform();
            };

            // Zoom out
            zoomOutBtn.onclick = () => {
                if (currentScale > 0.2) {
                    currentScale -= 0.2;

                    // Nếu zoom nhỏ hơn hoặc bằng 1, đặt lại về 1 và reset vị trí
                    if (currentScale <= 1.01) {
                        currentScale = 1;
                        translateX = 0;
                        translateY = 0;
                    }
                    updateTransform();
                }
            };

            // ===== CHỨC NĂNG KÉO/THẢ HÌNH ẢNH (DRAGGING) =====

            // MOUSE DOWN event để bắt đầu kéo
            modalImg.addEventListener('mousedown', (e) => {
                // Chỉ cho phép kéo nếu ảnh được phóng to (scale > 1)
                if (currentScale > 1) {
                    e.preventDefault();
                    isDragging = true;
                    startX = e.clientX;
                    startY = e.clientY;
                    modalImg.style.cursor = 'grabbing'; // Thay đổi con trỏ
                }
            });

            // MOUSE MOVE event để di chuyển hình ảnh
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;

                // Tính toán khoảng cách di chuyển
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;

                // Cập nhật vị trí
                translateX += dx;
                translateY += dy;

                // Áp dụng biến đổi
                updateTransform();

                // Đặt lại điểm bắt đầu cho sự kiện di chuyển tiếp theo
                startX = e.clientX;
                startY = e.clientY;
            });

            // MOUSE UP/LEAVE events để kết thúc kéo (bắt trên document để không bị mất sự kiện)
            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    modalImg.style.cursor = 'grab'; // Đặt lại con trỏ
                }
            });

            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                // Kiểm tra trạng thái display là "flex"
                if (modal.style.display === "flex") {
                    if (e.key === "ArrowRight") {
                        nextBtn.click();
                    } else if (e.key === "ArrowLeft") {
                        prevBtn.click();
                    } else if (e.key === "Escape") {
                        closeBtn.click();
                    }
                }
            });
        });
    </script>
