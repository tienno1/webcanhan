<div class="gallery">
  <img src="https://picsum.photos/200/300" alt="Ảnh 1">
  <img src="https://picsum.photos/201/300" alt="Ảnh 2">
  <img src="https://picsum.photos/202/300" alt="Ảnh 3">
</div>

<!-- Lightbox -->
<div id="lightbox">
  <img src="" alt="preview">
</div>

<style>
  .gallery img {
    width: 150px;
    margin: 8px;
    cursor: pointer;
    border-radius: 8px;
    transition: 0.3s;
  }
  .gallery img:hover {
    transform: scale(1.05);
  }
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
  }
  #lightbox img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 10px;
  }
</style>

<script>
  const images = document.querySelectorAll(".gallery img");
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = lightbox.querySelector("img");

  images.forEach(img => {
    img.addEventListener("click", () => {
      lightbox.style.display = "flex";
      lightboxImg.src = img.src;
    });
  });

  lightbox.addEventListener("click", () => {
    lightbox.style.display = "none";
  });
</script>
